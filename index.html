<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #05050a;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; justify-content: center; align-items: center;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #wrapper {
    width: min(100vw, 1200px);
    aspect-ratio: 2 / 1;
    max-height: 100vh;
    position: relative;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    image-rendering: crisp-edges;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(255, 51, 68, 0.3);
  }
</style>
</head>
<body>
<div id="wrapper"><canvas id="game"></canvas></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 1000, H = 500;
const GROUND_Y = 420;
canvas.width = W;
canvas.height = H;

// --- AUDIO ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq, dur, type = 'square', vol = 0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function sfxHit() { playTone(200, 0.1, 'sawtooth', 0.2); playTone(80, 0.15, 'square', 0.15); }
function sfxBlock() { playTone(800, 0.08, 'square', 0.1); }
function sfxKO() { playTone(150, 0.5, 'sawtooth', 0.25); playTone(75, 0.7, 'square', 0.2); }

// --- STATE ---
const state = {
  mode: 'menu',
  round: 1,
  p1Wins: 0,
  p2Wins: 0,
  roundTimer: 60 * 60,
  screenShake: 0,
  hitSparks: [],
  floatingTexts: [],
  fighters: [],
  roundEndDelay: 0,
  roundWinner: null,
  matchWinner: null,
};

const input = { left: false, right: false, up: false, down: false };

// --- FIGHTER ---
class Fighter {
  constructor(x, facing, color, isAI) {
    this.x = x;
    this.y = GROUND_Y;
    this.vx = 0;
    this.vy = 0;
    this.facing = facing;
    this.color = color;
    this.isAI = isAI;
    this.health = 100;
    this.maxHealth = 100;
    this.isOnGround = true;
    this.crouching = false;
    this.blocking = false;
    this.attack = null;
    this.hitstun = 0;
    this.blockstun = 0;
    this.attackCooldown = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.aiTimer = 0;
    this.aiAction = 'idle';
    this.flashTimer = 0;
  }

  startAttack(type) {
    if (this.attack || this.hitstun > 0 || this.attackCooldown > 0) return;
    if (!this.isOnGround) return;
    const attacks = {
      punch: { startup: 3, active: 4, recovery: 5, reach: 65, damage: 6, hitstun: 12 },
      kick:  { startup: 6, active: 5, recovery: 9, reach: 90, damage: 10, hitstun: 16 },
    };
    this.attack = { type, ...attacks[type], frame: 0, hitDone: false };
    this.blocking = false;
    playTone(type === 'punch' ? 300 : 220, 0.06, 'square', 0.08);
  }

  update(opponent) {
    // Physics
    if (!this.isOnGround) {
      this.vy += 0.9;
      this.y += this.vy;
      if (this.y >= GROUND_Y) {
        this.y = GROUND_Y;
        this.vy = 0;
        this.isOnGround = true;
      }
    }

    // Horizontal motion
    if (this.isOnGround && !this.attack && this.hitstun === 0 && this.blockstun === 0) {
      this.x += this.vx;
    } else {
      this.x += this.vx * 0.5;
      this.vx *= 0.75;
    }

    // Attack
    if (this.attack) {
      this.attack.frame++;
      const a = this.attack;
      const total = a.startup + a.active + a.recovery;

      if (a.frame > a.startup && a.frame <= a.startup + a.active && !a.hitDone) {
        const hbX = this.x + this.facing * a.reach;
        const dx = Math.abs(hbX - opponent.x);
        const dy = Math.abs(this.y - opponent.y);
        // Crouch reduces hurtbox — high attacks miss low target if crouching? keep simple
        const inRange = dx < a.reach * 0.7 && dy < 120;

        if (inRange && opponent.hitstun === 0 && opponent.blockstun === 0) {
          const isBlocking = opponent.blocking || opponent.blockstun > 0;
          let dmg = a.damage;

          if (isBlocking) {
            dmg *= 0.15;
            opponent.blockstun = 8;
            this.attack.hitDone = true;
            sfxBlock();
            spawnSpark(hbX, this.y - 80, '#88ccff', 8);
          } else {
            opponent.health = Math.max(0, opponent.health - dmg);
            opponent.hitstun = a.hitstun;
            opponent.flashTimer = a.hitstun;
            this.combo++;
            this.comboTimer = 60;
            state.floatingTexts.push({
              x: hbX, y: this.y - 140,
              text: `-${Math.floor(dmg)}`,
              color: '#ff3344', life: 40, vy: -2.5, size: 26,
            });
            spawnSpark(hbX, this.y - 80, '#ffdd44', 18);
            state.screenShake = 10;
            opponent.vx = this.facing * 8;
            this.attack.hitDone = true;
            sfxHit();
          }
        }
      }

      if (a.frame >= total) {
        this.attack = null;
        this.attackCooldown = 3;
      }
    }

    // Timers
    if (this.attackCooldown > 0) this.attackCooldown--;
    if (this.hitstun > 0) this.hitstun--;
    if (this.blockstun > 0) this.blockstun--;
    if (this.flashTimer > 0) this.flashTimer--;
    if (this.comboTimer > 0) {
      this.comboTimer--;
      if (this.comboTimer === 0) this.combo = 0;
    }

    // Face opponent when free
    if (!this.attack && this.hitstun === 0 && this.isOnGround) {
      const shouldFace = opponent.x > this.x ? 1 : -1;
      if (shouldFace !== this.facing) this.facing = shouldFace;
    }

    this.x = Math.max(60, Math.min(W - 60, this.x));

    if (this.isAI) this.updateAI(opponent);
  }

  updateAI(opponent) {
    if (this.hitstun > 0 || this.attack) { this.vx = 0; this.aiAction = 'idle'; return; }

    this.aiTimer--;
    const dist = Math.abs(this.x - opponent.x);
    const dir = Math.sign(opponent.x - this.x);

    if (this.aiTimer > 0) {
      if (this.aiAction === 'walk') this.vx = dir * 2.2;
      else if (this.aiAction === 'block') { this.blocking = true; this.vx = 0; }
      else this.vx = 0;
      return;
    }

    this.blocking = false;
    const r = Math.random();

    // React to incoming attack
    if (opponent.attack && dist < 130 && r < 0.35) {
      this.blocking = true;
      this.vx = 0;
      this.aiAction = 'block';
      this.aiTimer = 25;
      return;
    }

    if (dist > 140) {
      this.vx = dir * 2.2;
      this.aiAction = 'walk';
      this.aiTimer = 15;
    } else if (dist < 110) {
      this.vx = 0;
      if (r < 0.45) this.startAttack('punch');
      else if (r < 0.75) this.startAttack('kick');
      else if (r < 0.9) { this.blocking = true; this.aiAction = 'block'; }
      else if (this.isOnGround) { this.vy = -13; this.isOnGround = false; }
      this.aiTimer = 28;
      this.aiAction = 'attack';
    } else {
      this.vx = dir * 1.8;
      this.aiAction = 'walk';
      this.aiTimer = 12;
    }
  }

  draw(ctx) {
    const crouchY = (this.crouching && this.isOnGround) ? 28 : 0;
    const isHurt = this.flashTimer > 0 && this.flashTimer % 6 < 3;
    const isBlocking = this.blocking || this.blockstun > 0;

    // Pose
    let armPose = 'idle';
    let kickPose = null;
    if (this.attack) {
      const a = this.attack;
      const active = a.frame <= a.startup + a.active;
      if (a.type === 'punch') armPose = active ? 'punch-out' : 'punch-recover';
      else kickPose = active ? 'kick-out' : 'kick-recover';
    }

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(this.facing, 1);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(0, 4, 38, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Flash overlay tint
    const bodyColor = isHurt ? '#ffffff' : this.color;
    const skinColor = isHurt ? '#ffffff' : '#f5c89a';

    const legY = -62 + crouchY;

    // Legs
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 11;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-4, legY);
    ctx.lineTo(-14, -4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(6, legY);
    if (kickPose === 'kick-out') ctx.lineTo(70, -58);
    else if (kickPose === 'kick-recover') ctx.lineTo(35, -40);
    else ctx.lineTo(16, -4);
    ctx.stroke();

    // Torso
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(-16, legY);
    ctx.lineTo(16, legY);
    ctx.lineTo(13, -135 + crouchY);
    ctx.lineTo(-13, -135 + crouchY);
    ctx.closePath();
    ctx.fill();

    // Belt
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(-16, legY - 8, 32, 7);

    // Head
    ctx.fillStyle = skinColor;
    ctx.beginPath();
    ctx.arc(0, -158 + crouchY, 19, 0, Math.PI * 2);
    ctx.fill();

    // Headband
    ctx.fillStyle = '#ff3344';
    ctx.fillRect(-21, -174 + crouchY, 42, 9);
    ctx.beginPath();
    ctx.moveTo(-21, -170 + crouchY);
    ctx.lineTo(-38, -155 + crouchY);
    ctx.lineTo(-38, -143 + crouchY);
    ctx.lineTo(-21, -160 + crouchY);
    ctx.fill();

    // Eyes
    ctx.fillStyle = isHurt ? '#ff0000' : '#000';
    ctx.fillRect(-9, -162 + crouchY, 7, 4);
    ctx.fillRect(3, -162 + crouchY, 7, 4);

    // Arms
    ctx.strokeStyle = bodyColor;
    ctx.lineWidth = 10;
    if (isBlocking) {
      ctx.beginPath(); ctx.moveTo(-13, -122 + crouchY); ctx.lineTo(-4, -88 + crouchY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(13, -122 + crouchY); ctx.lineTo(4, -88 + crouchY); ctx.stroke();
    } else if (armPose === 'punch-out') {
      ctx.beginPath(); ctx.moveTo(-13, -122 + crouchY); ctx.lineTo(-22, -92 + crouchY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(13, -122 + crouchY); ctx.lineTo(70, -122 + crouchY); ctx.stroke();
      ctx.fillStyle = skinColor;
      ctx.beginPath(); ctx.arc(70, -122 + crouchY, 9, 0, Math.PI * 2); ctx.fill();
    } else if (armPose === 'punch-recover') {
      ctx.beginPath(); ctx.moveTo(-13, -122 + crouchY); ctx.lineTo(-25, -92 + crouchY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(13, -122 + crouchY); ctx.lineTo(45, -122 + crouchY); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(-13, -122 + crouchY); ctx.lineTo(-22, -92 + crouchY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(13, -122 + crouchY); ctx.lineTo(26, -92 + crouchY); ctx.stroke();
    }

    ctx.restore();

    // Combo indicator above opponent
    if (this.combo >= 2 && this.comboTimer > 0) {
      ctx.fillStyle = '#ffd700';
      ctx.font = 'bold 28px system-ui';
      ctx.textAlign = 'center';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#ffd700';
      ctx.fillText(`${this.combo} HITS`, this.x, this.y - 230);
      ctx.shadowBlur = 0;
    }
  }
}

function spawnSpark(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 7 + 2;
    state.hitSparks.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 2,
      life: 25,
      maxLife: 25,
      color,
      size: Math.random() * 4 + 2,
    });
  }
}

// --- GAME FLOW ---
let p1, p2;

function startRound() {
  p1 = new Fighter(300, 1, '#ff3344', false);
  p2 = new Fighter(700, -1, '#3388ff', true);
  state.fighters = [p1, p2];
  state.roundTimer = 60 * 60;
  state.hitSparks = [];
  state.floatingTexts = [];
  state.mode = 'fight';
  state.roundWinner = null;
}

function newMatch() {
  state.round = 1;
  state.p1Wins = 0;
  state.p2Wins = 0;
  startRound();
}

function endRound(winner) {
  state.mode = 'roundEnd';
  state.roundWinner = winner;
  state.roundEndDelay = 120;
  if (winner === 'p1') state.p1Wins++;
  else if (winner === 'p2') state.p2Wins++;
  sfxKO();

  setTimeout(() => {
    if (state.p1Wins >= 2 || state.p2Wins >= 2) {
      state.mode = 'matchEnd';
      state.matchWinner = state.p1Wins > state.p2Wins ? 'p1' : 'p2';
    } else {
      state.round++;
      startRound();
    }
  }, 2200);
}

// --- UPDATE ---
function update() {
  if (state.mode === 'fight') {
    state.roundTimer--;

    if (state.roundTimer <= 0) {
      if (p1.health > p2.health) endRound('p1');
      else if (p2.health > p1.health) endRound('p2');
      else endRound('draw');
      return;
    }

    // Player movement
    if (!p1.attack && p1.hitstun === 0 && p1.blockstun === 0) {
      p1.vx = 0;
      if (input.left) { p1.vx = -3.5; p1.blocking = false; }
      if (input.right) { p1.vx = 3.5; p1.blocking = false; }
      p1.crouching = input.down && p1.isOnGround;
      if (p1.crouching) p1.vx *= 0.3;
    } else {
      p1.crouching = false;
    }

    p1.update(p2);
    p2.update(p1);

    // Push apart
    const dist = Math.abs(p1.x - p2.x);
    if (dist < 70) {
      const push = (70 - dist) / 2;
      if (p1.x < p2.x) { p1.x -= push; p2.x += push; }
      else { p1.x += push; p2.x -= push; }
    }

    // KO check
    if (p1.health <= 0) endRound('p2');
    else if (p2.health <= 0) endRound('p1');
  }

  // Particles
  for (let i = state.hitSparks.length - 1; i >= 0; i--) {
    const s = state.hitSparks[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.35;
    s.life--;
    if (s.life <= 0) state.hitSparks.splice(i, 1);
  }
  for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
    const t = state.floatingTexts[i];
    t.y += t.vy; t.life--;
    if (t.life <= 0) state.floatingTexts.splice(i, 1);
  }

  if (state.screenShake > 0) state.screenShake *= 0.85;
  if (state.screenShake < 0.3) state.screenShake = 0;
}

// --- RENDER ---
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#1a0a1e');
  grad.addColorStop(0.5, '#4a1830');
  grad.addColorStop(1, '#c94a3c');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sun
  ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
  ctx.beginPath(); ctx.arc(W/2, 300, 160, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(W/2, 300, 100, 0, Math.PI * 2); ctx.fill();

  // Clouds
  ctx.fillStyle = 'rgba(255, 150, 100, 0.3)';
  ctx.beginPath(); ctx.ellipse(200, 120, 80, 18, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(820, 180, 90, 20, 0, 0, Math.PI * 2); ctx.fill();

  // Mountains
  ctx.fillStyle = '#2a1524';
  ctx.beginPath();
  ctx.moveTo(0, 430);
  ctx.lineTo(120, 260);
  ctx.lineTo(260, 360);
  ctx.lineTo(420, 220);
  ctx.lineTo(580, 340);
  ctx.lineTo(740, 240);
  ctx.lineTo(880, 320);
  ctx.lineTo(1000, 280);
  ctx.lineTo(1000, 430);
  ctx.closePath();
  ctx.fill();

  // Ground
  ctx.fillStyle = '#1a0a14';
  ctx.fillRect(0, GROUND_Y + 20, W, H - GROUND_Y);

  // Neon ground line
  ctx.strokeStyle = '#ff3344';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#ff3344';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y + 20);
  ctx.lineTo(W, GROUND_Y + 20);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = 'rgba(255, 51, 68, 0.15)';
  ctx.lineWidth = 1;
  for (let i = -100; i < W; i += 60) {
    ctx.beginPath();
    ctx.moveTo(i, GROUND_Y + 20);
    ctx.lineTo(i + 40, H);
    ctx.stroke();
  }
}

function drawHUD() {
  const barY = 30;
  const barH = 26;
  const barW = 380;
  const pad = 25;

  // P1
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(pad, barY, barW, barH);
  ctx.strokeStyle = '#ff3344';
  ctx.lineWidth = 2;
  ctx.strokeRect(pad, barY, barW, barH);
  const p1Fill = (barW - 4) * (p1.health / p1.maxHealth);
  const grad1 = ctx.createLinearGradient(pad, 0, pad + barW, 0);
  grad1.addColorStop(0, '#ff3344');
  grad1.addColorStop(1, '#ff8866');
  ctx.fillStyle = grad1;
  ctx.fillRect(pad + 2, barY + 2, p1Fill, barH - 4);

  // P2
  const bar2X = W - pad - barW;
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(bar2X, barY, barW, barH);
  ctx.strokeStyle = '#3388ff';
  ctx.strokeRect(bar2X, barY, barW, barH);
  const p2Fill = (barW - 4) * (p2.health / p2.maxHealth);
  const grad2 = ctx.createLinearGradient(bar2X, 0, bar2X + barW, 0);
  grad2.addColorStop(0, '#66aaff');
  grad2.addColorStop(1, '#3388ff');
  ctx.fillStyle = grad2;
  ctx.fillRect(bar2X + 2 + (barW - 4 - p2Fill), barY + 2, p2Fill, barH - 4);

  // Names
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('PLAYER', pad, barY - 6);
  ctx.textAlign = 'right';
  ctx.fillText('AI', W - pad, barY - 6);

  // Timer
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 52px system-ui';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#fff';
  ctx.fillText(Math.ceil(state.roundTimer / 60), W/2, 72);
  ctx.shadowBlur = 0;

  // Round wins
  for (let i = 0; i < state.p1Wins; i++) {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(pad + 12 + i * 26, barY + barH + 16, 7, 0, Math.PI * 2);
    ctx.fill();
  }
  for (let i = 0; i < state.p2Wins; i++) {
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(W - pad - 12 - i * 26, barY + barH + 16, 7, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = '#888';
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(`ROUND ${state.round}`, W/2, 100);
}

function render() {
  ctx.save();

  if (state.screenShake > 0) {
    ctx.translate(
      (Math.random() - 0.5) * state.screenShake,
      (Math.random() - 0.5) * state.screenShake
    );
  }

  drawBackground();

  if (state.fighters.length > 0) {
    state.fighters.forEach(f => f.draw(ctx));
  }

  // Sparks
  for (const s of state.hitSparks) {
    const alpha = s.life / s.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = s.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * alpha, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // Floating text
  for (const t of state.floatingTexts) {
    ctx.globalAlpha = Math.min(1, t.life / 20);
    ctx.fillStyle = t.color;
    ctx.font = `bold ${t.size}px system-ui`;
    ctx.textAlign = 'center';
    ctx.shadowBlur = 10;
    ctx.shadowColor = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  ctx.restore();

  if (state.mode === 'fight' || state.mode === 'roundEnd') drawHUD();

  if (state.mode === 'menu') drawMenu();
  if (state.mode === 'roundEnd') {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 90px system-ui';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ffd700';
    let text = 'DRAW';
    if (state.roundWinner === 'p1') text = 'YOU WIN';
    else if (state.roundWinner === 'p2') text = 'AI WINS';
    ctx.fillText(text, W/2, H/2);
    ctx.shadowBlur = 0;
  }
  if (state.mode === 'matchEnd') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, W, H);
    const win = state.matchWinner === 'p1';
    ctx.fillStyle = win ? '#ffd700' : '#ff3344';
    ctx.font = 'bold 80px system-ui';
    ctx.textAlign = 'center';
    ctx.shadowBlur = 30;
    ctx.shadowColor = ctx.fillStyle;
    ctx.fillText(win ? 'VITTORIA' : 'SCONFITTA', W/2, H/2 - 20);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px system-ui';
    ctx.fillText('Premi INVIO per ricominciare', W/2, H/2 + 50);
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 82px system-ui';
  ctx.textAlign = 'center';
  ctx.shadowBlur = 40;
  ctx.shadowColor = '#ff3344';
  ctx.fillText('NEON FIGHTER', W/2, H/2 - 60);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px system-ui';
  ctx.fillText('Premi INVIO per iniziare', W/2, H/2 + 20);
  ctx.font = '15px system-ui';
  ctx.fillStyle = '#aaa';
  ctx.fillText('A/D ← →  muoviti    W/↑  salta    S/↓  accovacciati', W/2, H/2 + 70);
  ctx.fillText('J  pugno    K  calcio    L  parata', W/2, H/2 + 100);
}

// --- INPUT ---
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (state.mode === 'menu' || state.mode === 'matchEnd') {
      ensureAudio();
      newMatch();
      return;
    }
  }
  if (state.mode !== 'fight' || !p1) return;
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft') { input.left = true; e.preventDefault(); }
  if (k === 'd' || k === 'arrowright') { input.right = true; e.preventDefault(); }
  if (k === 'w' || k === 'arrowup') {
    if (p1.isOnGround && !p1.attack && p1.hitstun === 0) {
      p1.vy = -15;
      p1.isOnGround = false;
    }
    e.preventDefault();
  }
  if (k === 's' || k === 'arrowdown') { input.down = true; e.preventDefault(); }
  if (k === 'j') p1.startAttack('punch');
  if (k === 'k') p1.startAttack('kick');
  if (k === 'l') { if (!p1.attack && p1.hitstun === 0) p1.blocking = true; }
});

document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft') input.left = false;
  if (k === 'd' || k === 'arrowright') input.right = false;
  if (k === 's' || k === 'arrowdown') input.down = false;
  if (k === 'l' && p1) p1.blocking = false;
});

// --- LOOP ---
let lastTime = performance.now();
let accumulator = 0;
const STEP = 1000 / 60;

function loop(time) {
  const dt = Math.min(time - lastTime, 100);
  lastTime = time;
  accumulator += dt;

  while (accumulator >= STEP) {
    update();
    accumulator -= STEP;
  }

  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
