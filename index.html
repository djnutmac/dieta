<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Neon Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #05050a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: absolute; top: 0; left: 0; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; padding: 20px 28px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 10; font-weight: 700;
    letter-spacing: 2px; font-size: 14px; text-transform: uppercase;
  }
  #hud .item { text-shadow: 0 0 10px currentColor; }
  #score { color: #00ff9d; }
  #highscore { color: #a259ff; }
  #level { color: #ffd700; }
  #lives {
    position: absolute; bottom: 20px; left: 28px; z-index: 10;
    pointer-events: none; color: #ff2e63; font-size: 18px;
    letter-spacing: 4px; text-shadow: 0 0 10px currentColor;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: rgba(5, 5, 15, 0.85); backdrop-filter: blur(4px);
    z-index: 20; text-align: center; transition: opacity 0.3s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: clamp(32px, 8vw, 72px); font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #ff2e63, #ffd700, #00ff9d, #00b3ff, #a259ff);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite; margin-bottom: 20px;
  }
  @keyframes shine { to { background-position: 200% center; } }
  #overlay .subtitle { font-size: 18px; color: #8b949e; margin-bottom: 30px; letter-spacing: 1px; }
  #overlay .hint { font-size: 13px; color: #8b949e; margin-top: 16px; opacity: 0.7; }
  #overlay .big-score {
    font-size: 52px; font-weight: 900; color: #ffd700;
    text-shadow: 0 0 25px #ffd700; margin: 10px 0 20px;
  }
  #overlay .btn {
    padding: 14px 36px; border-radius: 30px; border: 2px solid #00b3ff;
    background: transparent; color: #00b3ff; font-size: 16px;
    font-weight: 700; letter-spacing: 2px; cursor: pointer;
    text-transform: uppercase; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(0,179,255,0.3), inset 0 0 20px rgba(0,179,255,0.1);
  }
  #overlay .btn:hover {
    background: rgba(0,179,255,0.15); transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0,179,255,0.5), inset 0 0 20px rgba(0,179,255,0.2);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="item" id="score">SCORE 0</div>
  <div class="item" id="level">LEVEL 1</div>
  <div class="item" id="highscore">BEST 0</div>
</div>
<div id="lives">♥♥♥</div>

<div id="overlay">
  <h1>NEON BREAKOUT</h1>
  <div class="subtitle" id="overlay-subtitle">Distruggi tutti i mattoni</div>
  <button class="btn" id="start-btn">INIZIA</button>
  <div class="hint">Mouse o ← → · Spazio per lanciare/pausa · R per ricominciare</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const levelEl = document.getElementById('level');
const highscoreEl = document.getElementById('highscore');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const overlaySubtitle = document.getElementById('overlay-subtitle');
const startBtn = document.getElementById('start-btn');

let W, H, bgGradient;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  bgGradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  bgGradient.addColorStop(0, '#12122a');
  bgGradient.addColorStop(1, '#05050a');
  if (state.paddle) {
    state.paddle.y = H - 50;
    state.paddle.x = Math.min(state.paddle.x, W - state.paddle.w / 2);
  }
}
window.addEventListener('resize', resize);

const state = {
  mode: 'menu',
  score: 0,
  highScore: parseInt(localStorage.getItem('neonBreakoutBest') || '0'),
  lives: 3,
  level: 1,
  paddle: null,
  ball: null,
  ballTrail: [],
  bricks: [],
  particles: [],
  stars: [],
};
const input = { left: false, right: false, mouseX: null };

function initStars() {
  state.stars = [];
  for (let i = 0; i < 120; i++) {
    state.stars.push({
      x: Math.random() * W, y: Math.random() * H,
      size: Math.random() * 1.8 + 0.3,
      speed: Math.random() * 0.4 + 0.1,
      alpha: Math.random() * 0.6 + 0.15
    });
  }
}

function createBricks() {
  state.bricks = [];
  const rows = Math.min(3 + state.level, 7);
  const cols = Math.min(7 + Math.floor(state.level / 2), 11);
  const topOffset = 100, sideMargin = 40, padding = 6, brickH = 26;
  const brickW = (W - sideMargin * 2 - (cols - 1) * padding) / cols;
  const colors = ['#ff2e63','#ff8a00','#ffd700','#00ff9d','#00b3ff','#a259ff','#ff5fb0'];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const hp = Math.min(rows - r, 3);
      state.bricks.push({
        x: sideMargin + c * (brickW + padding),
        y: topOffset + r * (brickH + padding),
        w: brickW, h: brickH,
        hp, maxHp: hp,
        color: colors[(rows - r - 1) % colors.length],
        alive: true,
      });
    }
  }
}

function createPaddle() {
  state.paddle = {
    w: Math.max(80, Math.min(W * 0.15, 160)),
    h: 14, x: W / 2, y: H - 50, speed: 8,
  };
}

function resetBall() {
  state.ball = {
    x: state.paddle.x, y: state.paddle.y - 20, r: 8,
    vx: 0, vy: 0, speed: 5 + state.level * 0.4, stuck: true,
  };
  state.ballTrail = [];
}

function launchBall() {
  if (!state.ball || !state.ball.stuck) return;
  state.ball.stuck = false;
  const angle = (Math.random() - 0.5) * (Math.PI / 4);
  state.ball.vx = Math.sin(angle) * state.ball.speed;
  state.ball.vy = -Math.cos(angle) * state.ball.speed;
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 4 + 1.5;
    state.particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, size: Math.random()*3 + 1.5, color
    });
  }
}

function updateHUD() {
  scoreEl.textContent = `SCORE ${state.score}`;
  levelEl.textContent = `LEVEL ${state.level}`;
  highscoreEl.textContent = `BEST ${Math.max(state.highScore, state.score)}`;
  livesEl.textContent = '♥'.repeat(state.lives) + '♡'.repeat(Math.max(0, 3 - state.lives));
}

let flashMsg = null;
function showFlash(text, color) { flashMsg = { text, color, life: 1 }; }

function update(dt) {
  const step = Math.min(dt * 60, 2);
  for (const s of state.stars) {
    s.y += s.speed * step;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.x += p.vx * step; p.y += p.vy * step;
    p.vy += 0.15 * step; p.life -= 0.025 * step;
    if (p.life <= 0) state.particles.splice(i, 1);
  }
  if (state.mode !== 'playing') return;

  const p = state.paddle;
  const b = state.ball;

  let targetX = input.mouseX !== null ? input.mouseX : p.x;
  if (input.mouseX === null) {
    if (input.left) targetX -= p.speed * step * 1.5;
    if (input.right) targetX += p.speed * step * 1.5;
  }
  targetX = Math.max(p.w/2, Math.min(W - p.w/2, targetX));
  p.x += (targetX - p.x) * 0.35 * step;

  if (b.stuck) {
    b.x = p.x;
    b.y = p.y - b.r - 2;
    return;
  }

  b.x += b.vx * step;
  b.y += b.vy * step;

  state.ballTrail.push({ x: b.x, y: b.y });
  if (state.ballTrail.length > 12) state.ballTrail.shift();

  if (b.x - b.r < 0) { b.x = b.r; b.vx = Math.abs(b.vx); }
  if (b.x + b.r > W) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
  if (b.y - b.r < 0) { b.y = b.r; b.vy = Math.abs(b.vy); }

  if (b.vy > 0 && b.y + b.r >= p.y && b.y - b.r <= p.y + p.h &&
      b.x + b.r >= p.x - p.w/2 && b.x - b.r <= p.x + p.w/2) {
    b.y = p.y - b.r;
    const hitPos = (b.x - p.x) / (p.w / 2);
    const angle = hitPos * (Math.PI / 3);
    b.speed = Math.min(b.speed + 0.05, 14);
    b.vx = Math.sin(angle) * b.speed;
    b.vy = -Math.cos(angle) * b.speed;
  }

  if (b.y - b.r > H) {
    state.lives--;
    updateHUD();
    if (state.lives <= 0) return gameOver();
    return resetBall();
  }

  for (const brick of state.bricks) {
    if (!brick.alive) continue;
    if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w &&
        b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {
      const oL = (b.x + b.r) - brick.x;
      const oR = (brick.x + brick.w) - (b.x - b.r);
      const oT = (b.y + b.r) - brick.y;
      const oB = (brick.y + brick.h) - (b.y - b.r);
      const min = Math.min(oL, oR, oT, oB);
      if (min === oL)      { b.x = brick.x - b.r; b.vx = -Math.abs(b.vx); }
      else if (min === oR) { b.x = brick.x + brick.w + b.r; b.vx = Math.abs(b.vx); }
      else if (min === oT) { b.y = brick.y - b.r; b.vy = -Math.abs(b.vy); }
      else                 { b.y = brick.y + brick.h + b.r; b.vy = Math.abs(b.vy); }
      brick.hp--;
      if (brick.hp <= 0) {
        brick.alive = false;
        state.score += 10 * brick.maxHp;
        spawnParticles(brick.x + brick.w/2, brick.y + brick.h/2, brick.color);
        updateHUD();
      } else {
        spawnParticles(b.x, b.y, brick.color);
      }
      break;
    }
  }

  if (state.bricks.every(br => !br.alive)) nextLevel();
}

function render() {
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, W, H);

  for (const s of state.stars) {
    ctx.globalAlpha = s.alpha;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const brick of state.bricks) {
    if (!brick.alive) continue;
    const alpha = 0.35 + (brick.hp / brick.maxHp) * 0.65;
    ctx.shadowBlur = 8; ctx.shadowColor = brick.color;
    ctx.globalAlpha = alpha; ctx.fillStyle = brick.color;
    ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = brick.color; ctx.lineWidth = 1.5;
    ctx.strokeRect(brick.x, brick.y, brick.w, brick.h);
    if (brick.hp > 1) {
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff';
      ctx.fillRect(brick.x + 4, brick.y + 4, brick.w - 8, 2);
      ctx.globalAlpha = 1;
    }
  }

  for (const p of state.particles) {
    ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
    ctx.shadowBlur = 10; ctx.shadowColor = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  if (state.paddle) {
    const p = state.paddle;
    ctx.shadowBlur = 25; ctx.shadowColor = '#00b3ff';
    ctx.fillStyle = '#00b3ff';
    ctx.beginPath(); ctx.roundRect(p.x - p.w/2, p.y, p.w, p.h, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.roundRect(p.x - p.w/2 + 3, p.y + 3, p.w - 6, 2, 1); ctx.fill();
  }

  if (state.ballTrail.length > 0) {
    for (let i = 0; i < state.ballTrail.length; i++) {
      const pos = state.ballTrail[i];
      const t = i / state.ballTrail.length;
      ctx.globalAlpha = t * 0.5; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(pos.x, pos.y, state.ball.r * t, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  if (state.ball) {
    const b = state.ball;
    ctx.shadowBlur = 25; ctx.shadowColor = '#fff';
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(180, 220, 255, 0.6)';
    ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, b.r * 0.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0;
}

function startGame() {
  state.mode = 'playing';
  state.score = 0;
  state.lives = 3;
  state.level = 1;
  state.particles = [];
  createPaddle();
  createBricks();
  resetBall();
  updateHUD();
  overlay.classList.add('hidden');
}

function nextLevel() {
  state.level++;
  state.score += 100 * state.level;
  createBricks();
  resetBall();
  updateHUD();
  showFlash(`LIVELLO ${state.level}`, '#ffd700');
}

function gameOver() {
  state.mode = 'gameover';
  if (state.score > state.highScore) {
    state.highScore = state.score;
    localStorage.setItem('neonBreakoutBest', state.highScore);
  }
  overlay.classList.remove('hidden');
  overlay.querySelector('h1').textContent = 'GAME OVER';
  overlaySubtitle.innerHTML = `<div class="big-score">${state.score}</div>Record: ${state.highScore}`;
  startBtn.textContent = 'RIPROVA';
}

function togglePause() {
  if (state.mode === 'playing') {
    state.mode = 'paused';
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = 'PAUSA';
    overlaySubtitle.textContent = 'Premi SPAZIO per continuare';
    startBtn.textContent = 'CONTINUA';
  } else if (state.mode === 'paused') {
    state.mode = 'playing';
    overlay.classList.add('hidden');
  }
}

document.addEventListener('mousemove', (e) => { input.mouseX = e.clientX; });
document.addEventListener('touchmove', (e) => {
  e.preventDefault();
  input.mouseX = e.touches[0].clientX;
}, { passive: false });
document.addEventListener('touchstart', (e) => {
  input.mouseX = e.touches[0].clientX;
  if (state.mode === 'playing' && state.ball?.stuck) launchBall();
  else if (state.mode === 'menu' || state.mode === 'gameover') startGame();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') { input.left = true; input.mouseX = null; }
  if (e.key === 'ArrowRight' || e.key === 'd') { input.right = true; input.mouseX = null; }
  if (e.key === ' ') {
    e.preventDefault();
    if (state.mode === 'menu' || state.mode === 'gameover') startGame();
    else if (state.mode === 'playing') {
      if (state.ball?.stuck) launchBall();
      else togglePause();
    } else if (state.mode === 'paused') togglePause();
  }
  if (e.key === 'r' || e.key === 'R') startGame();
});
document.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
});
startBtn.addEventListener('click', () => {
  if (state.mode === 'paused') togglePause();
  else startGame();
});

let lastTime = performance.now();
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  update(dt);
  render();

  if (flashMsg) {
    flashMsg.life -= dt * 1.2;
    if (flashMsg.life <= 0) flashMsg = null;
    else {
      ctx.globalAlpha = flashMsg.life;
      ctx.font = 'bold 48px system-ui';
      ctx.textAlign = 'center';
      ctx.fillStyle = flashMsg.color;
      ctx.shadowBlur = 20; ctx.shadowColor = flashMsg.color;
      ctx.fillText(flashMsg.text, W/2, H/2);
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(loop);
}

resize();
initStars();
createPaddle();
createBricks();
resetBall();
updateHUD();
requestAnimationFrame(loop);
</script>
</body>
</html>
