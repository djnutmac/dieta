<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il mio piano alimentare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <button id="back-btn" class="icon-btn" aria-label="Indietro" hidden>←</button>
    <h1 id="page-title">Il mio piano alimentare</h1>
    <button id="theme-toggle" class="icon-btn" aria-label="Cambia tema">🌙</button>
  </header>

  <main id="app" class="app-main"></main>

  <footer class="app-footer">
    <p id="footer-text"></p>
  </footer>

  <!-- Modale per le ricette -->
  <div id="modal" class="modal" hidden>
    <div class="modal-content"></div>
  </div>

  <!-- Lightbox per le immagini -->
  <div id="lightbox" class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Chiudi">×</button>
    <button class="lightbox-prev" aria-label="Precedente">‹</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-next" aria-label="Successivo">›</button>
    <p id="lightbox-caption"></p>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
